<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Bank Account - TaskRunner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {

                        "success-light": "#d1fae5",
                        "on-background": "#1a1b23",

                        "on-secondary": "#ffffff",
                        "surface-bright": "#fbf8ff",
                        "surface": "#fbf8ff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#e5e2e1",
                        "info-blue": "#1e40af",
                        "secondary-fixed-dim": "#c8c6c6",
                        "surface-container-low": "#f3f2fe",
                        "on-secondary-container": "#636262",
                        "on-secondary-fixed": "#1c1b1c",
                        "surface-muted": "#fbf8ff",
                        "primary-container": "#003ec7",
                        "on-error": "#ffffff",
                        "outline": "#747686",
                        "tertiary-container": "#952301",
                        "primary-fixed-dim": "#b7c4ff",
                        "tertiary": "#6d1600",
                        "error-container": "#ffdad6",
                        "info-bg": "#dbeafe",
                        "warning-red": "#991b1b",
                        "on-tertiary-fixed": "#3c0800",
                        "on-surface": "#1a1b23",
                        "primary": "#002b92",
                        "on-tertiary-container": "#ffaa94",
                        "secondary": "#5f5e5e",
                        "on-primary-fixed": "#001452",
                        "surface-container-lowest": "#ffffff",
                        "success-emerald": "#10b981",
                        "surface-variant": "#e2e1ed",
                        "on-primary": "#ffffff",
                        "surface-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#0038b6",
                        "background": "#fbf8ff",
                        "surface-container": "#ededf8",
                        "surface-container-high": "#e8e7f3",
                        "inverse-surface": "#2f3039",
                        "on-surface-variant": "#434654",
                        "secondary-container": "#e2dfdf",
                        "inverse-on-surface": "#f0f0fb",
                        "warning-bg": "#fee2e2",
                        "tertiary-fixed": "#ffdbd2",
                        "tertiary-fixed-dim": "#ffb4a1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "touch-target": "48px",
                        "margin": "16px",
                        "container-max": "672px",
                        "stack-gap": "12px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24 pt-16">
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline">
<div class="flex justify-between items-center px-gutter h-touch-target max-w-container-max mx-auto">
<button class="flex items-center justify-center w-touch-target h-touch-target rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high active:scale-95 transition-transform duration-100 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed tracking-tight">TaskRunner</h1>
<button class="flex items-center justify-center w-touch-target h-touch-target rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high active:scale-95 transition-transform duration-100 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="toggle_on">toggle_on</span>
</button>
</div>
</header>
<main class="max-w-container-max mx-auto px-gutter py-margin">
<div class="mb-6 flex items-center">
<button aria-label="Go back" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors mr-3">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Bank Account</h2>
</div>
<form class="space-y-stack-gap">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-margin shadow-sm">
<div class="space-y-4">
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="accountHolder">Account Holder Name</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="accountHolder" placeholder="John Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="accountNumber">Account Number</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="accountNumber" inputmode="numeric" placeholder="••••••••••••" required="" type="password"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="confirmAccountNumber">Confirm Account Number</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="confirmAccountNumber" inputmode="numeric" placeholder="••••••••••••" required="" type="password"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="ifscCode">IFSC Code</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors uppercase" id="ifscCode" placeholder="ABCD0123456" required="" type="text"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="bankName">Bank Name</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="bankName" placeholder="Global Standard Bank" required="" type="text"/>
</div>
</div>
</div>
<div class="mt-8">
<button class="w-full h-touch-target bg-primary-container text-on-primary-container font-label-bold text-label-bold rounded-xl active:scale-98 transition-transform duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
                    Save Bank Account
                </button>
</div>
</form>
</main>
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm md:hidden">
<div class="flex justify-around items-center h-20 px-gutter border-t border-outline-variant dark:border-outline max-w-container-max mx-auto">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-margin py-unit hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-md text-label-md mt-1">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-margin py-unit hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-md text-label-md mt-1">Chat</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-margin py-unit hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Earnings</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-margin py-unit hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-98 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</div>
</nav>
</body></html>
