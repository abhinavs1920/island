<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TaskRunner - Targets</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#1a1b23",
                        "surface-dim": "#d9d9e4",
                        "info-bg": "#dbeafe",
                        "error": "#ba1a1a",
                        "surface-tint": "#2551d8",
                        "surface-container-highest": "#e2e1ed",
                        "success-light": "#d1fae5",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#891f00",
                        "background": "#fbf8ff",
                        "surface": "#fbf8ff",
                        "outline-variant": "#c4c5d7",
                        "on-tertiary-container": "#ffaa94",
                        "on-primary-fixed-variant": "#0038b6",
                        "on-background": "#1a1b23",
                        "primary": "#002b92",
                        "surface-container-high": "#e8e7f3",
                        "on-secondary-fixed-variant": "#474647",
                        "surface-bright": "#fbf8ff",
                        "secondary-fixed-dim": "#c8c6c6",
                        "warning-red": "#991b1b",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e2e1ed",
                        "primary-container": "#003ec7",
                        "on-tertiary-fixed": "#3c0800",
                        "surface-lowest": "#ffffff",
                        "on-primary-fixed": "#001452",
                        "on-primary-container": "#adbcff",
                        "inverse-surface": "#2f3039",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dde1ff",
                        "warning-bg": "#fee2e2",
                        "success-emerald": "#10b981",
                        "surface-container": "#ededf8",
                        "on-surface-variant": "#434654",
                        "inverse-primary": "#b7c4ff",
                        "primary-fixed-dim": "#b7c4ff",
                        "surface-container-low": "#f3f2fe",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f0fb",
                        "outline": "#747686",
                        "secondary-fixed": "#e5e2e1",
                        "secondary": "#5f5e5e",
                        "tertiary-fixed-dim": "#ffb4a1",
                        "on-secondary-fixed": "#1c1b1c",
                        "surface-muted": "#fbf8ff",
                        "secondary-container": "#e2dfdf",
                        "on-error": "#ffffff",
                        "info-blue": "#1e40af",
                        "tertiary-fixed": "#ffdbd2",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#636262",
                        "tertiary-container": "#952301",
                        "tertiary": "#6d1600"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin": "16px",
                        "container-max": "672px",
                        "stack-gap": "12px",
                        "touch-target": "48px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 80%;
            max-height: 250px;
        }
        .circle-bg {
            fill: none;
            stroke: #e2e1ed;
            stroke-width: 3.8;
        }
        .circle {
            fill: none;
            stroke-width: 3.8;
            stroke-linecap: round;
            animation: progress 1s ease-out forwards;
        }
        @keyframes progress {
            0% {
                stroke-dasharray: 0 100;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-touch-target max-w-container-max mx-auto bg-surface dark:bg-on-surface">
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-full scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight">Targets</h1>
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-full scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-[calc(48px+16px)] pb-[calc(64px+48px+32px)] px-margin max-w-container-max mx-auto flex flex-col gap-margin">
<!-- Daily Target Section -->
<section class="bg-surface-lowest rounded-xl shadow-sm border border-outline-variant p-margin flex flex-col items-center justify-center text-center relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-primary"></div>
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase mb-4">Daily Target</h2>
<div class="relative w-48 h-48 mb-4">
<svg class="circular-chart w-full h-full text-primary-container" viewbox="0 0 36 36">
<path class="circle-bg" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"></path>
<path class="circle stroke-current" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="70, 100"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-display-lg text-display-lg text-on-surface">₹350</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">of ₹500</span>
</div>
</div>
<p class="font-body-lg text-body-lg text-primary font-bold">
                3 more gigs to hit your daily target!
            </p>
</section>
<!-- Weekly Progress Section -->
<section class="bg-surface-lowest rounded-xl shadow-sm border border-outline-variant p-margin relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-primary"></div>
<div class="flex justify-between items-center mb-6">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase">Weekly Earnings</h2>
<span class="font-label-md text-label-md bg-surface-container-high px-3 py-1 rounded-full">₹1550 Total</span>
</div>
<!-- Bar Chart -->
<div class="flex items-end justify-between h-40 mt-4 gap-2">
<!-- Mon -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-primary-container rounded-t-DEFAULT h-[80%]"></div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Mon</span>
</div>
<!-- Tue -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-primary-container rounded-t-DEFAULT h-[60%]"></div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Tue</span>
</div>
<!-- Wed -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-primary-container rounded-t-DEFAULT h-[100%] relative">
<span class="absolute -top-6 left-1/2 -translate-x-1/2 font-label-bold text-[10px] text-primary">High</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Wed</span>
</div>
<!-- Thu (Today) -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-primary-container rounded-t-DEFAULT h-[70%]"></div>
<span class="font-label-md text-label-md text-primary font-bold mt-2 text-[10px]">Thu</span>
</div>
<!-- Fri -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-surface-container-highest rounded-t-DEFAULT h-[5%]"></div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Fri</span>
</div>
<!-- Sat -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-surface-container-highest rounded-t-DEFAULT h-[5%]"></div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Sat</span>
</div>
<!-- Sun -->
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-surface-container-highest rounded-t-DEFAULT h-[5%]"></div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-[10px]">Sun</span>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<div class="fixed bottom-[64px] left-0 w-full px-margin pb-margin max-w-container-max mx-auto z-40 bg-gradient-to-t from-surface via-surface to-transparent pt-8">
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile rounded-xl shadow-md flex items-center justify-center gap-2 scale-98 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
            Go Online Now
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin py-unit h-16 max-w-container-max mx-auto bg-surface dark:bg-on-surface md:hidden">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors scale-98 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1 text-[10px]">Home</span>
</a>
<!-- Targets (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors scale-98 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="insights" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-md text-label-md mt-1 text-[10px]">Targets</span>
</a>
<!-- History (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors scale-98 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md mt-1 text-[10px]">History</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors scale-98 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1 text-[10px]">Profile</span>
</a>
</nav>
</body></html>
