<style>
        .bottom-sheet-anim {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim h-screen w-full flex flex-col items-center justify-end overflow-hidden font-body-md text-body-md">
<!-- Background overlay (simulating map/task view behind) -->
<div class="absolute inset-0 bg-on-background/20 z-0" data-alt="A blurred overhead map view of a bustling city street layout in a light-mode color palette. The map shows winding roads and subtle green parks, with a tactical corporate feel suitable for a gig worker app. The lighting suggests daytime visibility." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCTLZXyZHTuJlhwF01COyD3WAHFLgLdIZcHYwlF3D2my3VbXmvPOz5iQ78TA02ag4ByD6JMGyA8ugC6ZnxpNzWAWI7OHjvUW9gRfSmW12njKisoai56Om0jikDIEAOIRvRGzEJkjUIf0vLsWLQMeHE6UySWQcCCH71QRMgN_49XFWjBNFwgWjESES3XGnArmtRvJPQPzrmPmeV0TFP1tSCEzQPY-s8vJC0-9kxSDUzf5pYxs3OWWSyMGjO9kyuZK4Z6Fh9lG7jkVs4')"></div>
<!-- Bottom Sheet Container -->
<div class="relative w-full max-w-container-max bg-surface-lowest rounded-t-[24px] shadow-lg flex flex-col z-10 bottom-sheet-anim pb-safe">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-unit pb-stack-gap">
<div class="w-12 h-1.5 bg-outline-variant rounded-full mt-2"></div>
</div>
<div class="px-gutter pb-gutter flex flex-col gap-stack-gap">
<!-- Destination Header -->
<div class="flex flex-col gap-unit mb-margin">
<span class="font-label-bold text-label-bold text-secondary uppercase tracking-wider">Navigate to</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">123 Maple Avenue, Suite 4B, Indiranagar</h2>
</div>
<!-- Navigation Options -->
<button class="w-full min-h-[64px] bg-primary-container text-on-primary-container rounded-xl flex items-center justify-between px-margin py-stack-gap active:scale-[0.98] transition-transform duration-200 border-l-4 border-primary">
<div class="flex items-center gap-margin">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-body-lg text-body-lg text-surface-lowest">Open in Google Maps</span>
</div>
<span class="material-symbols-outlined text-surface-lowest opacity-80">arrow_forward_ios</span>
</button>
<button class="w-full min-h-[64px] bg-surface-container-low text-on-surface rounded-xl flex items-center justify-between px-margin py-stack-gap border border-outline-variant hover:bg-surface-container active:scale-[0.98] transition-all duration-200 shadow-sm">
<div class="flex items-center gap-margin">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-body-lg text-body-lg">Open in Apple Maps</span>
</div>
<span class="material-symbols-outlined text-outline">arrow_forward_ios</span>
</button>
<!-- Cancel Action -->
<div class="flex justify-center mt-margin">
<button class="min-h-touch-target px-margin font-label-md text-label-md text-secondary hover:text-on-surface transition-colors">
                    Cancel
                </button>
</div>
</div>
</div>
