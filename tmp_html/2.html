</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">You've arrived at the dropoff.</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Please proceed to hand over the package.</p>
</div>
<!-- Task Info Details -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-margin flex flex-col gap-stack-gap">
<div class="flex items-center gap-3">
<div class="w-1 h-8 bg-primary rounded-full"></div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Order Number</p>
<p class="font-body-lg text-body-lg text-on-surface font-bold">#8492</p>
</div>
</div>
<div class="h-px bg-outline-variant w-full my-2"></div>
<div class="flex items-center gap-3">
<div class="w-1 h-8 bg-info-blue rounded-full"></div>

</div>
</div>
