<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased pb-[100px] pt-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flat no shadows">
<div class="flex justify-between items-center px-gutter h-touch-target max-w-container-max mx-auto">
<button class="h-touch-target w-touch-target flex items-center justify-center text-primary hover:bg-surface-container active:scale-95 transition-transform duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Withdrawal</h1>
<div class="w-touch-target"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-container-max mx-auto px-gutter mt-margin flex flex-col gap-stack-gap">
<!-- Available Balance Card -->
<section class="bg-surface-container-low rounded-xl p-margin shadow-sm border border-outline-variant relative overflow-hidden active:scale-98 transition-all duration-200 cursor-pointer">
<div class="absolute top-0 left-0 bottom-0 w-unit bg-primary"></div>
<div class="flex flex-col ml-unit">
<span class="font-label-md text-label-md text-secondary mb-1">Available Balance</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-display-lg text-display-lg text-on-surface">₹1,240.00</span>
</div>
</div>
</section>
<!-- Withdrawal Amount Input -->
<section class="bg-surface-lowest rounded-xl p-margin shadow-sm border border-outline-variant flex flex-col gap-2 relative">
<div class="absolute top-0 left-0 bottom-0 w-unit bg-tertiary-container"></div>
<label class="font-label-bold text-label-bold text-on-surface ml-unit" for="withdrawalAmount">Withdrawal Amount</label>
<div class="relative flex items-center ml-unit">
<span class="absolute left-4 font-headline-lg text-headline-lg text-secondary">₹</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container rounded-lg border border-outline-variant text-on-surface font-headline-lg text-headline-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none" id="withdrawalAmount" inputmode="decimal" placeholder="0.00" type="number"/>
</div>
<p class="text-sm text-secondary ml-unit mt-1">Min. withdrawal ₹100.00</p>
</section>
<!-- Bank Details Card -->
<section class="bg-surface-container rounded-xl p-margin shadow-sm border border-outline-variant flex flex-col gap-3">
<div class="flex justify-between items-center">
<h3 class="font-label-bold text-label-bold text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="account_balance">account_balance</span>
                    Linked Bank Account
                </h3>
<button class="font-label-md text-label-md text-primary hover:underline px-2 py-1 active:scale-95 transition-transform">Change</button>
</div>
<div class="flex items-center gap-3 bg-surface-lowest p-3 rounded-lg border border-outline-variant">
<div class="w-10 h-10 bg-surface-variant rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="museum">museum</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">HDFC Bank</span>
<span class="font-label-md text-label-md text-secondary tracking-widest">• •••• 1234</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-[80px] w-full max-w-container-max left-1/2 -translate-x-1/2 px-gutter pb-margin bg-surface bg-opacity-90 backdrop-blur-sm z-40 flex flex-col gap-2">
<p class="text-center text-xs text-secondary mb-2 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
            Estimated processing time: 24-48 hours
        </p>
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile rounded-xl shadow-sm hover:bg-primary hover:text-on-primary active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
            Withdraw Now
             <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface shadow-sm md:hidden">
<div class="flex justify-around items-center h-20 px-gutter border-t border-outline-variant max-w-container-max mx-auto">
<a class="flex flex-col items-center justify-center text-secondary px-margin py-unit hover:bg-surface-container-high active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-md text-label-md mt-1">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-margin py-unit hover:bg-surface-container-high active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-md text-label-md mt-1">Chat</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-margin py-unit hover:bg-surface-container-high active:scale-98 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md mt-1">Earnings</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-margin py-unit hover:bg-surface-container-high active:scale-98 transition-all duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</div>
</nav>
</body></html>
