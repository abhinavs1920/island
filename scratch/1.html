      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-[72px] pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline">
<div class="flex items-center justify-between px-gutter h-touch-target max-w-container-max mx-auto active:scale-95 duration-100">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="person">person</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary dark:text-primary-fixed uppercase tracking-tighter">DELIVERY PRO</h1>
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="sensors">sensors</span>
</div>
<!-- Status Hero Toggle -->
<div class="w-full bg-success-emerald text-on-primary py-2 px-gutter flex justify-between items-center max-w-container-max mx-auto">
<span class="font-label-bold text-label-bold">Online</span>
<div class="w-14 h-8 bg-on-primary rounded-full p-1 cursor-pointer flex items-center justify-end shadow-inner relative">
<div class="w-6 h-6 bg-success-emerald rounded-full shadow-sm absolute right-1"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col w-full max-w-container-max mx-auto relative h-[calc(100vh-152px)]">
<!-- Map Area -->
<div class="h-[60%] w-full relative overflow-hidden bg-surface-variant z-0">
<img class="w-full h-full object-cover" data-alt="A detailed aerial map view of a city grid. The map highlights a navigation route from one point to another, typical of a delivery tracking application. The styling is modern corporate, utilizing a bright light-mode aesthetic with clean lines and subtle color shifts for streets and blocks, aligning with a reliable gig-worker tool interface." data-location="New York" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiecrbQjIwRhf_hrAalj7fR6G1kypdhYMPkOGsW02MGUA4c-w6IozKPWsrGyd5MbIMZJTB9crfcaY0qkuKFFqrIK62oJ3erHvwlBDrJlhza0n9kLTaCzZieSYqPa1Zu1tnkP1upqxZeAi-9EigM52O2DjTrYZ5BShVoBd8Xd3-ClBn0U1rLsvL1qwipdLcnZuUE_4os6AQ_Bw0kUOPkdABd484Smj6p4kq0QnuCg3_85SUOVJJsfqJybNWRjXQMjwJ_0GwVdKmdgQ"/>
<!-- Top Status Overlay on Map -->
<div class="absolute top-margin left-1/2 transform -translate-x-1/2 bg-surface-container-lowest shadow-sm border border-outline-variant rounded-full px-4 py-2 flex items-center gap-2 z-10">
<span class="w-2 h-2 rounded-full bg-success-emerald"></span>
<span class="font-label-bold text-label-bold text-on-surface">Active Task</span>
</div>
</div>
<!-- Gig Details Card Overlay -->
<div class="h-[40%] w-full bg-surface-container-lowest rounded-t-xl -mt-4 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-gutter flex flex-col justify-between border-t border-outline-variant relative">
<!-- Accent Bar -->
<div class="absolute left-0 top-6 bottom-6 w-1 bg-primary rounded-r-sm"></div>
<!-- Header Info -->
<div class="flex justify-between items-start pl-unit">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Sarah J.</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]" data-icon="storefront">storefront</span>
                        123 Pine St.
                    </p>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]" data-icon="home">home</span>
                        456 Maple Ave.
                    </p>
</div>
<div class="text-right">
<div class="font-display-lg text-[24px] text-primary font-bold">12 min</div>
<div class="font-label-md text-label-md text-on-surface-variant">2.4 km</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-stack-gap mt-margin w-full">
<button class="flex-1 bg-primary-container hover:bg-primary text-on-primary-container hover:text-on-primary flex items-center justify-center gap-2 h-touch-target rounded-lg font-label-bold text-label-bold transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="chat_bubble" data-weight="fill">chat_bubble</span>
                    Chat
                </button>
<button class="flex-1 bg-success-emerald hover:bg-success-light text-on-primary hover:text-on-surface flex items-center justify-center gap-2 h-touch-target rounded-lg font-label-bold text-label-bold transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="call" data-weight="fill">call</span>
                    Call
                </button>
</div>
<!-- Cancel Link -->
<div class="text-center mt-stack-gap">
<button class="font-label-md text-label-md text-error hover:text-warning-red transition-colors py-2 px-4 rounded-full hover:bg-error-container/30">

<div class="flex justify-around items-center h-16 px-gutter w-full max-w-container-max mx-auto">
<!-- Tasks (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-container-low active:scale-98 transition-transform duration-200">
<span class="material-symbols-outlined font-display-lg text-display-lg text-primary" data-icon="local_shipping" data-weight="fill">local_shipping</span>
<span class="font-label-md text-label-md text-primary dark:text-primary-fixed mt-1">Tasks</span>
</button>

<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-md text-label-md mt-1">Chat</span>
</button>
<!-- Earnings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant dark:text-secondary-fixed-dim hover:bg-surface-container-highest dark:hover:bg-surface-container-low active:scale-98 transition-transform duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Earnings</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant dark:text-secondary-fixed-dim hover:bg-surface-container-highest dark:hover:bg-surface-container-low active:scale-98 transition-transform duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>
</div>
</nav>
